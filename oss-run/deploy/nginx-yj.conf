# ============================================================
#  警院智慧考试平台 · nginx 反向代理（放到 /etc/nginx/conf.d/yj-exam.conf）
#  前端静态页与接口全部由 yj-bff 同源提供，nginx 只做 80 入口 + 压缩 + 缓存
#  注意：/yjapi 必须原样透传，由 Node 自己剥前缀，不要在这里 rewrite
# ============================================================
server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;

    access_log  /var/log/nginx/yj-exam.access.log;
    error_log   /var/log/nginx/yj-exam.error.log warn;

    client_max_body_size 50m;

    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_vary         on;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml;

    # 带哈希的构建产物：长缓存
    location /assets/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 入口页不缓存，避免发版后拿到旧的壳去加载已删除的 chunk
    location = /index.html {
        proxy_pass http://127.0.0.1:8090;
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
